# cron备份 https://www.iamwawa.cn/crontab.html
#'0 * * * *' # Runs every hour, on the hour
#
#
name: Latest blog post workflow
on:
  schedule: # Run workflow automatically https://cron.ciding.cc/
    - cron: '23 4 * * *' # 北京时间 12:23 执行 → UTC 04:23
  workflow_dispatch: # Run workflow manually (without waiting for the cron to be called), through the GitHub Actions Workflow page directly
permissions:
  contents: write # To write the generated contents to the readme

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: 设置 Node.js
        uses: actions/setup-node@v5 # 升级到 v4，设置 node.js 环境
        with:
          node-version: '22'
      - name: Pull in dev.to posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          template: '<li>[$date] <a href="$url">$title</a></li>$newline'
          date_format: 'yyyy-mm-dd'
          feed_list: "https://zlay.fun/atom.xml"